# Kehler OS – Fahrzeugkonfiguration (Schemabeispiel)
#
# Diese Datei zeigt das **tatsächliche** Format von `vehicle.yaml`. Sie wird
# nicht geladen; sie erklärt die Felder.
#
# Die gelebte Konfiguration ist `vehicle.yaml` — dort steht das reale
# Fahrzeug. Adressen und Zugangsdaten gehören ausdrücklich **nicht** hierher,
# sondern nach `config/hardware/` (ungetrackt).
#
# Grundregel: Ein leeres Feld führt in der Oberfläche zu „Nicht konfiguriert"
# oder zum Wegfall des Bedienelements — nie zu einer erfundenen Zahl
# (Kapitel 18 §98).

version: 2
name: Beispielfahrzeug

# Räume dienen der Gruppierung und der räumlichen Statusdarstellung.
areas:
  - { id: living,   name_key: area.living }
  - { id: tech,     name_key: area.tech }
  - { id: exterior, name_key: area.exterior }

# ── Entities ─────────────────────────────────────────────────────────────────
#
# Eine flache Liste. Die **Befehle ergeben sich aus dem Typ** — die Oberfläche
# bietet nie etwas an, was hier nicht steht (Kapitel 12 §55, Kapitel 13 §60).
#
#   measurement   Zahlenwert, keine Bedienung
#   contact       binärer Sensor (OPEN/CLOSED), keine Bedienung
#   status        mehrwertiger Zustand (Brennerphase), keine Bedienung
#   switch        set_state(ON|OFF)
#   movable       open / close / stop
#   setpoint      set_value — **nur mit `max_value`**, sonst nur Anzeige
#
# Zwei Kennzeichen unterdrücken jede Bedienung — sie bedeuten Verschiedenes:
#
#   configured: false   Die Funktion existiert, ihr fehlt die Zuordnung.
#                       Oberfläche: „Nicht konfiguriert"
#   unverified: true    Ob die Funktion über die Schnittstelle überhaupt
#                       verfügbar ist, ist nicht bestätigt.
#                       Oberfläche: „Noch zu verifizieren"

entities:

  # Ein Messwert. `deadband` verhindert, dass ein zappelnder Sensor Netz und
  # Oberfläche flutet; `expected_interval_s` lässt den Wert sichtbar altern,
  # wenn Aktualisierungen ausbleiben.
  - id: water.tank.fresh.large
    name_key: tank.fresh_large
    type: measurement
    unit: percent
    capacity_l: 550           # ohne Angabe: nur Prozent, keine Liter
    warn_below: 20            # Schwellen sind optional …
    critical_below: 10        # … und werden nie erfunden (Punkt C3)
    deadband: 0.5
    expected_interval_s: 30

  # Ein einstellbarer Wert. Fehlt `max_value`, entsteht kein Befehl und damit
  # kein Bedienelement — der Wert bleibt sichtbar. Genau so verhindert das
  # System, dass eine unbekannte Obergrenze geraten wird (Kapitel 18 §136).
  - id: energy.shore.limit
    name_key: energy.shore_limit
    type: setpoint
    area: tech
    unit: A
    min_value: 3
    max_value: 16
    step: 1
    risk: MEDIUM

  # Batteriekapazität und Nennspannung ergeben zusammen den Energieinhalt.
  # Fehlt eines von beiden, gibt es keine Restlaufzeit.
  - id: energy.battery.soc
    name_key: energy.battery_soc
    type: measurement
    unit: percent
    capacity_ah: 900
    nominal_voltage: 24
    deadband: 0.5
    expected_interval_s: 10

  # Bewegliche Aufbauteile. `risk: HIGH` macht den Befehl
  # bestätigungspflichtig; `timeout_ms` ist die physikalische Laufzeit.
  - id: vehicle.garage.door
    name_key: vehicle.garage_door
    type: movable
    area: garage
    timeout_ms: 20000
    risk: MEDIUM

  # Vorgesehen, aber ohne Hardwarezuordnung. Die Oberfläche zeigt
  # „Nicht konfiguriert" und bietet keine Bedienung an (Kapitel 18 §101).
  - id: vehicle.awning.main
    name_key: vehicle.awning
    type: movable
    area: exterior
    configured: false

  # Ein mehrwertiger Zustand. `states` ist das **interne Vokabular von
  # Kehler OS**, nicht das des Geräts — die Zuordnung von Rohwerten macht der
  # Adapter. Ohne diese Liste wird der Zustand nicht simuliert, weil der
  # Simulator sonst raten müsste.
  #
  # Anführungszeichen sind Pflicht: YAML liest ON und OFF sonst als
  # Wahrheitswerte.
  - id: heating.burner.state
    name_key: heating.burner
    type: status
    area: tech
    states: ["OFF", "DEMAND", "HEATING", "POSTRUN", "FAULT"]
    unverified: true          # Registerliste liegt nicht vor (Punkt G1)
    configured: false

# ── Was hier NICHT steht ─────────────────────────────────────────────────────
#
# * Hardwareadressen, IP-Adressen, Zugangsdaten  → `config/hardware/`
# * Beleuchtung — sie läuft über gewöhnliche Lichtschalter und ist nicht
#   angebunden (Punkt F1)
# * Nivellierung — ausdrücklich nach Version 1.0 (Kapitel 18 §91)
# * Kameras — es wird keine angenommen (Punkt H1)
