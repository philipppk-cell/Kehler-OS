# ════════════════════════════════════════════════════════════════════════════
#  FAHRZEUGBESCHREIBUNG
# ════════════════════════════════════════════════════════════════════════════
#
# Diese Datei sagt, WELCHE Funktionen das Fahrzeug besitzt — nicht, an welcher
# Klemme sie hängen. Hardwareadressen stehen in `config/hardware/` und werden
# nicht versioniert.
#
# Sie gilt in allen Betriebsarten. Simulation und Produktivbetrieb
# unterscheiden sich im Adapter, nicht im Fahrzeug: Ein Wohnmobil hat dieselben
# Tanks, ob die Werte nun aus der SPS oder aus dem Simulator kommen.
#
# ── Herkunft der Angaben ────────────────────────────────────────────────────
#
# Jeder Eintrag ist mit einer der beiden Kennzeichnungen versehen:
#
#   BESTÄTIGT   vom Fahrzeughalter genannt oder auf den Fotos zu sehen
#   VORLÄUFIG   plausibel angenommen, damit die Entwicklung weiterlaufen kann.
#               Diese Einträge sind zu prüfen, bevor reale Hardware angebunden
#               wird (Kapitel 18 §97/§98).
#
# Bewusst NICHT enthalten:
#   - Warnschwellen   → offener Punkt C3, noch nicht festgelegt
#   - Hardwareadressen → offener Punkt A3
#   - RGB-Beleuchtung, Dachluken, Alarmanlage, Satellit, Kameras
#     (nicht bestätigte Hardware — Kapitel 18 §34)
#
# Die Nivellierung fehlt absichtlich: Hydraulik ist ausdrücklich nicht das
# erste Testobjekt (Kapitel 18 §91).

version: 2
name: Kehler

areas:
  - { id: cab,      name_key: area.cab }
  - { id: living,   name_key: area.living }
  - { id: kitchen,  name_key: area.kitchen }
  - { id: bedroom,  name_key: area.bedroom }
  - { id: bathroom, name_key: area.bathroom }
  - { id: garage,   name_key: area.garage }
  - { id: tech,     name_key: area.tech }
  - { id: exterior, name_key: area.exterior }

entities:

  # ── Wasser ────────────────────────────────────────────────────────────────
  # BESTÄTIGT: zwei Frischwassertanks (550 l und 450 l), Grauwasser 280 l,
  # Schwarzwasser 370 l.
  #
  # BESTÄTIGT: Die Tanks sind gleichmäßig geformt. Die Umrechnung
  # Prozent → Liter ist damit linear und korrekt; es braucht keine
  # Kalibrierkurve.
  #
  # BESTÄTIGT: Zwei Stufen je Tank.
  #   Frischwasser   Warnung unter 20 %,  kritisch unter 10 %
  #   Abwasser       Warnung über  80 %,  kritisch über  90 %
  #
  # Die kritische Stufe bleibt eng gefasst, damit sie selten ist. Zu viele
  # kritische Meldungen entwerten die Priorität (Kapitel 13 §55).

  - id: water.tank.fresh.large
    name_key: tank.fresh_large
    type: measurement
    unit: percent
    capacity_l: 550
    warn_below: 20
    critical_below: 10
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.fresh.small
    name_key: tank.fresh_small
    type: measurement
    unit: percent
    capacity_l: 450
    warn_below: 20
    critical_below: 10
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.grey
    name_key: tank.grey
    type: measurement
    unit: percent
    capacity_l: 280
    warn_above: 80
    critical_above: 90
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.black
    name_key: tank.black
    type: measurement
    unit: percent
    capacity_l: 370
    warn_above: 80
    critical_above: 90
    deadband: 0.5
    expected_interval_s: 30

  # VORLÄUFIG: dass es eine schaltbare Wasserpumpe gibt, ist anzunehmen —
  # bestätigt ist es nicht.
  - id: water.pump.main
    name_key: water.pump
    type: switch
    area: tech
    timeout_ms: 2000

  # ── Energie ───────────────────────────────────────────────────────────────
  # BESTÄTIGT: Victron-Anlage, 24-V-Lithiumsystem, Solar auf dem Dach
  # (zehn Module, auf den Fotos sichtbar), Landstromanschluss.
  #
  # VORLÄUFIG: die konkrete Aufteilung der Messwerte. Welche Größen der
  # Cerbo GX tatsächlich liefert, folgt aus der Anbindung (Punkt B1/B2).
  # Die hier gelisteten gibt es in jeder Victron-Anlage.
  #
  # Read-only, mit **zwei** Ausnahmen (Punkt B3, ADR 0003): Eingangsstrom-
  # begrenzung und Wechselrichter ein/aus. Victron bleibt Energiemanagement
  # und Schutzinstanz (Kapitel 12 §33) — Kehler OS regelt nicht mit.
  #
  # Vorzeichenkonvention Batterie: **positiv = laden**, negativ = entladen.

  # BESTÄTIGT: 900 Ah. Zusammen mit der Nennspannung ergibt das den
  # Energieinhalt (900 Ah × 24 V = 21,6 kWh) und daraus die Restlaufzeit.
  - id: energy.battery.soc
    name_key: energy.battery_soc
    type: measurement
    unit: percent
    capacity_ah: 900
    nominal_voltage: 24
    deadband: 0.5
    expected_interval_s: 10

  - id: energy.battery.voltage
    name_key: energy.battery_voltage
    type: measurement
    unit: V
    deadband: 0.1
    expected_interval_s: 10

  - id: energy.battery.current
    name_key: energy.battery_current
    type: measurement
    unit: A
    deadband: 0.5
    expected_interval_s: 10

  - id: energy.battery.power
    name_key: energy.battery_power
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  - id: energy.solar.power
    name_key: energy.solar_power
    type: measurement
    unit: W
    deadband: 5
    expected_interval_s: 10

  - id: energy.consumption.power
    name_key: energy.consumption
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  - id: energy.shore.connected
    name_key: energy.shore_connected
    type: contact
    area: tech
    expected_interval_s: 15

  - id: energy.shore.power
    name_key: energy.shore_power
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  # Eingangsstrombegrenzung — einer der beiden erlaubten Schreibzugriffe.
  #
  # BESTÄTIGT: Der Landstromanschluss ist mit 16 A abgesichert. `max_value`
  # bildet genau das ab — der Command Bus weist jeden höheren Wert ab, auch
  # wenn ein Client die Oberfläche umgeht (Kapitel 15 §42).
  #
  # Risiko MEDIUM und nicht HIGH: Innerhalb von 3–16 A kann kein Wert die
  # Zuleitung überlasten, weil die Obergrenze die Absicherung ist. Eine
  # Bestätigung bei jedem Schritt wäre Reibung ohne Schutzwirkung
  # (Kapitel 15 §21).
  - id: energy.shore.limit
    name_key: energy.shore_limit
    type: setpoint
    area: tech
    unit: A
    min_value: 3
    max_value: 16
    step: 1
    risk: MEDIUM
    timeout_ms: 5000

  # Wechselrichter — der zweite erlaubte Schreibzugriff. HIGH bedeutet:
  # bestätigungspflichtig. Ein versehentliches Abschalten nimmt dem ganzen
  # Fahrzeug die 230-V-Versorgung.
  - id: energy.inverter.state
    name_key: energy.inverter
    type: switch
    area: tech
    risk: HIGH
    timeout_ms: 8000

  # ── Klima ─────────────────────────────────────────────────────────────────
  # BESTÄTIGT (2026-08-10): Klima und Heizung sind **getrennte Systeme** und
  # werden beide über die Steuerung geführt. Sie haben deshalb je einen
  # eigenen Bereich in der Oberfläche.
  #
  # VORLÄUFIG: Welche Geräte verbaut sind, ist noch nicht bekannt (Punkt G1).
  # Die Einträge halten die Struktur offen; sie werden ersetzt, sobald die
  # Geräteinformationen vorliegen.
  #
  # IST und SOLL sind getrennte Entities (Kapitel 13 §35): Die Messung ist
  # ein Messwert, der Sollwert eine Einstellung. Zwei Systeme mit einem
  # gemeinsamen Sollwert wären nicht getrennt.

  - id: climate.living.temperature
    name_key: climate.living_actual
    type: measurement
    area: living
    unit: celsius
    deadband: 0.2
    expected_interval_s: 30

  - id: climate.outside.temperature
    name_key: climate.outside_actual
    type: measurement
    area: exterior
    unit: celsius
    deadband: 0.2
    expected_interval_s: 60

  - id: climate.cooling.state
    name_key: climate.cooling
    type: switch
    area: living
    timeout_ms: 5000

  # VORLÄUFIG: Der Stellbereich ist angenommen. Anders als bei der
  # Strombegrenzung ist ein falscher Bereich hier ungefährlich — eine
  # Solltemperatur kann keine Leitung überlasten. Er wird trotzdem
  # korrigiert, sobald das Gerät bekannt ist.
  - id: climate.cooling.target
    name_key: climate.cooling_target
    type: setpoint
    area: living
    unit: celsius
    min_value: 16
    max_value: 30
    step: 0.5
    timeout_ms: 5000

  # ── Heizung: SCHEER selection 10/17 kW mit HeatMate V4.02 ────────────────
  #
  # BESTÄTIGT (2026-08-10): Verbaut ist eine **SCHEER selection 10/17 kW** mit
  # der Steuerung **SCHEER HeatMate V4.02**. Sie ist die zentrale Heizungs- und
  # Warmwasseranlage des Fahrzeugs.
  #
  # BESTÄTIGT: Die HeatMate bleibt bestehen und **behält die Regelung sowie
  # alle sicherheitsrelevanten Funktionen**. Kehler OS ist übergeordnete
  # Bedien- und Anzeigeebene — nicht Regler und nicht Schutzeinrichtung
  # (Kapitel 12 §33/§67, Kapitel 18 §29). Temperaturbegrenzer,
  # Brennersteuerung und Abschaltungen werden nicht nachgebaut und nicht
  # umgangen.
  #
  # Datenkette: SCHEER selection / HeatMate → Modbus → Siemens S7-1500 →
  # Kehler OS. Siehe ADR 0008.
  #
  # ────────────────────────────────────────────────────────────────────────
  # WARUM HIER ÜBERALL `unverified: true` STEHT
  #
  # Die Modbus-Registerliste der HeatMate **liegt nicht vor** (Punkt G1). Die
  # Anlage kann laut Hersteller CAN und Modbus, aber welcher Wert unter
  # welcher Adresse liegt, in welcher Skalierung, und welche Funktion sich
  # überhaupt schreiben lässt, ist unbekannt.
  #
  # Deshalb beschreibt diese Datei die Anlage bereits vollständig, aber jede
  # Funktion trägt `unverified: true`. Das ist kein Kommentar, sondern wirksam:
  # Eine unverifizierte Entity bekommt im Loader **keine Befehle** und damit in
  # der Oberfläche **kein Bedienelement** (config/loader.py). Die Struktur
  # steht, die Bedienung entsteht erst mit der Bestätigung.
  #
  # Adressen, Registernummern, Baudraten und Slave-IDs stehen hier ohnehin
  # nicht — sie gehören nach `config/hardware/` (ungetrackt) und werden nicht
  # erfunden (Kapitel 18 §97/§98).
  #
  # Die Zustandsnamen (`HEATING`, `POSTRUN`, …) sind das **interne Vokabular
  # von Kehler OS**, nicht das der HeatMate. Welcher Registerwert auf welchen
  # Namen abgebildet wird, ist Teil des offenen Punktes G1 — die Übersetzung
  # macht später der Adapter, nicht die Oberfläche.
  # ────────────────────────────────────────────────────────────────────────

  # ── Anlage ───────────────────────────────────────────────────────────────

  - id: heating.system.state
    name_key: heating.system
    type: switch
    area: tech
    unverified: true
    configured: false
    risk: MEDIUM
    timeout_ms: 10000

  - id: heating.system.fault
    name_key: heating.fault
    type: status
    area: tech
    unverified: true
    configured: false
    states: ["OK", "FAULT"]

  # Klartext oder Fehlernummer der HeatMate. Kehler OS stellt keine Diagnose,
  # es gibt weiter, was die Anlage meldet (Kapitel 13 §60).
  - id: heating.system.error_code
    name_key: heating.error_code
    type: status
    area: tech
    unverified: true
    configured: false

  # ── Temperatur ───────────────────────────────────────────────────────────
  #
  # BESTÄTIGT (2026-08-10): Die Anlage kennt **eine** Temperatur — einen Soll-
  # und einen Istwert. Kessel und Warmwasser werden **nicht** getrennt geführt.
  #
  # Ein früherer Entwurf hatte je einen Kessel- und einen Warmwasserwert. Das
  # war eine Annahme über den Aufbau der Anlage und ist damit erledigt: Zwei
  # Temperaturen anzuzeigen, wo es eine gibt, hätte eine Genauigkeit
  # vorgetäuscht, die die Anlage nicht hat.
  #
  # Wo der Fühler sitzt, ist nicht genannt und für das Modell auch nicht
  # nötig. Die Oberfläche nennt den Wert deshalb schlicht „Temperatur" und
  # nicht „Kesseltemperatur" — was nicht bekannt ist, wird nicht behauptet.

  - id: heating.temperature.actual
    name_key: heating.temperature_actual
    type: measurement
    area: tech
    unit: celsius
    unverified: true
    configured: false
    deadband: 0.5
    expected_interval_s: 30

  # Kein Stellbereich angegeben — also `min_value`/`max_value` leer und damit
  # keine Verstellung. Eine geratene Solltemperatur wäre eine Aussage über
  # eine Anlage mit eigener Sicherheitskette (Kapitel 18 §136).
  - id: heating.temperature.target
    name_key: heating.temperature_target
    type: setpoint
    area: tech
    unit: celsius
    unverified: true
    configured: false

  # ── Brenner (SCHEER selection) ───────────────────────────────────────────

  # Betriebsphase, nicht „an/aus": OFF, DEMAND, HEATING, POSTRUN, FAULT.
  # Ein zweiwertiger Kontakt könnte „Nachlauf" nicht von „aus" unterscheiden.
  - id: heating.burner.state
    name_key: heating.burner
    type: status
    area: tech
    unverified: true
    configured: false
    # Anführungszeichen sind Pflicht: YAML liest ON und OFF sonst als
    # Wahrheitswerte, und aus einer Brennerphase würde ein `true`.
    states: ["OFF", "DEMAND", "HEATING", "POSTRUN", "FAULT"]

  - id: heating.burner.hours
    name_key: heating.burner_hours
    type: measurement
    area: tech
    unit: h
    unverified: true
    configured: false
    expected_interval_s: 300

  - id: heating.service.due
    name_key: heating.service
    type: status
    area: tech
    unverified: true
    configured: false
    states: ["OK", "DUE"]

  # ── Heizkreise ───────────────────────────────────────────────────────────
  #
  # BESTÄTIGT (2026-08-10): **Zwei** Kreise, nicht drei.
  #
  #   Kreis 1  die Heizkörper im Wohnraum
  #   Kreis 2  die Fußbodenheizung
  #
  # Ein früherer Entwurf führte die Fußbodenheizung als dritten Kreis neben
  # zwei namenlosen „Heizkreis 1/2". Das war eine Erfindung — und sie hätte
  # in der Oberfläche einen Kreis gezeigt, den es nicht gibt.
  #
  # Die Kreise heißen deshalb nach dem, was sie beheizen, und nicht nach ihrer
  # Nummer. „Heizkörper" und „Fußbodenheizung" sind im Fahrzeug zu finden,
  # „Kreis 2" steht nur im Schaltplan (Kapitel 7 §31, Kapitel 18 §8).
  #
  # Jeder Kreis hat eine Umwälzpumpe. Ob die HeatMate sie einzeln zurückmeldet
  # oder nur den Kreis, klärt erst die Registerliste — deshalb stehen sie
  # getrennt.

  - id: heating.radiators.state
    name_key: heating.radiators
    type: switch
    area: living
    unverified: true
    configured: false
    timeout_ms: 10000

  - id: heating.radiators.pump
    name_key: heating.pump
    type: status
    area: tech
    unverified: true
    configured: false
    states: ["ON", "OFF"]

  - id: heating.floor.state
    name_key: heating.floor
    type: switch
    area: living
    unverified: true
    configured: false
    timeout_ms: 10000

  - id: heating.floor.pump
    name_key: heating.pump
    type: status
    area: tech
    unverified: true
    configured: false
    states: ["ON", "OFF"]

  # Absenkbetrieb der gesamten Anlage, nicht eines einzelnen Kreises.
  - id: heating.night.state
    name_key: heating.night
    type: switch
    area: tech
    unverified: true
    configured: false
    timeout_ms: 10000

  # ── Warmwasser ───────────────────────────────────────────────────────────
  #
  # Ohne eigene Temperatur: Die Anlage führt nur einen Temperaturwert
  # (siehe oben). Ein zweiter Fühler ist nicht genannt und wird nicht
  # angenommen.

  - id: heating.water.state
    name_key: heating.water
    type: switch
    area: tech
    unverified: true
    configured: false
    timeout_ms: 10000

  - id: heating.water.plus
    name_key: heating.water_plus
    type: switch
    area: tech
    unverified: true
    configured: false
    timeout_ms: 10000

  # Ob überhaupt eine Zirkulationspumpe verbaut und angebunden ist, ist offen.
  - id: heating.water.circulation
    name_key: heating.circulation
    type: switch
    area: tech
    unverified: true
    configured: false
    timeout_ms: 10000

  # ── Elektroheizung ───────────────────────────────────────────────────────

  - id: heating.electric.state
    name_key: heating.electric
    type: switch
    area: tech
    unverified: true
    configured: false
    risk: MEDIUM
    timeout_ms: 10000

  # BESTÄTIGT (2026-08-10): **Drei Stufen — 1 kW, 2 kW, 3 kW.**
  #
  # Stufe und Leistung sind hier dasselbe: Stufe 2 *ist* 2 kW. Ein früherer
  # Entwurf führte beides getrennt — eine Stufe ohne bekannten Bereich und
  # daneben eine gemessene Leistung. Das waren zwei Einträge für eine
  # Tatsache, und die gemessene Leistung war obendrein ein angenommener
  # Sensor.
  #
  # Es bleibt ein Eintrag, und er trägt die Einheit, die die Angabe hat: kW.
  #
  # Der Bereich 1–3 ist bestätigt. Ob sich die Stufe über die Schnittstelle
  # **setzen** lässt, ist es nicht — deshalb bleibt `unverified: true`, und
  # deshalb entsteht vorerst kein Bedienelement. Bestätigte Grenzen und
  # bestätigter Schreibzugriff sind zwei verschiedene Fragen.
  - id: heating.electric.power
    name_key: heating.electric_power
    type: setpoint
    area: tech
    unit: kW
    min_value: 1
    max_value: 3
    step: 1
    unverified: true
    configured: false
    risk: MEDIUM
    timeout_ms: 10000

  # SOLO, HYBRID, FALLBACK — soweit die Schnittstelle sie meldet.
  - id: heating.electric.mode
    name_key: heating.electric_mode
    type: status
    area: tech
    unverified: true
    configured: false
    states: ["SOLO", "HYBRID", "FALLBACK"]

  # ── Versorgung ───────────────────────────────────────────────────────────
  #
  # Die Elektroheizung hängt an 230 V. Ob sie arbeiten kann, ist damit keine
  # Frage an die Heizung, sondern an die Versorgung — deshalb steht sie hier
  # und nicht nur auf der Energieseite.

  - id: heating.supply.mains
    name_key: heating.mains
    type: contact
    area: tech
    unverified: true
    configured: false
    expected_interval_s: 30

  - id: heating.supply.wakeup
    name_key: heating.wakeup
    type: switch
    area: tech
    unverified: true
    configured: false
    timeout_ms: 10000

  # Tanküberwachung der HeatMate — welcher Tank und in welcher Einheit, ist
  # offen. Bewusst getrennt von den Wassertanks unter `water.`: Was die
  # Heizung überwacht, meldet die Heizung.
  - id: heating.tank.level
    name_key: heating.tank
    type: measurement
    area: tech
    unit: percent
    unverified: true
    configured: false
    deadband: 1
    expected_interval_s: 60

  # ── Licht ────────────────────────────────────────────────────────────────
  # BESTÄTIGT (2026-08-10): Die Beleuchtung wird **nicht** über die SPS
  # gesteuert, sondern über gewöhnliche Lichtschalter. Es gibt hier deshalb
  # keine Lichtentities — und in der Oberfläche keinen Lichtbereich.
  #
  # Das ist keine Lücke, die später gefüllt wird: Was nicht angebunden ist,
  # erscheint nicht (Kapitel 12 §55, Kapitel 13 §60).

  # ── Aufbau ────────────────────────────────────────────────────────────────
  # BESTÄTIGT durch die Fotos: Heckklappe (oben angeschlagen, hebt nach oben),
  # Eingangstür rechts, Markise auf der rechten Dachkante.
  # VORLÄUFIG: die Einstiegsstufe und sämtliche Laufzeiten.

  - id: vehicle.garage.door
    name_key: vehicle.garage_door
    type: movable
    area: garage
    timeout_ms: 20000
    risk: MEDIUM

  - id: vehicle.step.entry
    name_key: vehicle.step
    type: movable
    area: exterior
    timeout_ms: 12000
    risk: MEDIUM

  - id: vehicle.door.main
    name_key: vehicle.door_main
    type: contact
    area: exterior
    expected_interval_s: 5

  # Beispiel für eine vorgesehene, aber noch nicht zugeordnete Funktion.
  # Die Oberfläche zeigt „Nicht konfiguriert“ und bietet keine Bedienung an
  # (Kapitel 18 §101). Genau so werden später alle Funktionen aussehen,
  # deren Mapping noch fehlt.
  - id: vehicle.awning.main
    name_key: vehicle.awning
    type: movable
    area: exterior
    configured: false
