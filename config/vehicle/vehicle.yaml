# ════════════════════════════════════════════════════════════════════════════
#  FAHRZEUGBESCHREIBUNG
# ════════════════════════════════════════════════════════════════════════════
#
# Diese Datei sagt, WELCHE Funktionen das Fahrzeug besitzt — nicht, an welcher
# Klemme sie hängen. Hardwareadressen stehen in `config/hardware/` und werden
# nicht versioniert.
#
# Sie gilt in allen Betriebsarten. Simulation und Produktivbetrieb
# unterscheiden sich im Adapter, nicht im Fahrzeug: Ein Wohnmobil hat dieselben
# Tanks, ob die Werte nun aus der SPS oder aus dem Simulator kommen.
#
# ── Herkunft der Angaben ────────────────────────────────────────────────────
#
# Jeder Eintrag ist mit einer der beiden Kennzeichnungen versehen:
#
#   BESTÄTIGT   vom Fahrzeughalter genannt oder auf den Fotos zu sehen
#   VORLÄUFIG   plausibel angenommen, damit die Entwicklung weiterlaufen kann.
#               Diese Einträge sind zu prüfen, bevor reale Hardware angebunden
#               wird (Kapitel 18 §97/§98).
#
# Bewusst NICHT enthalten:
#   - Warnschwellen   → offener Punkt C3, noch nicht festgelegt
#   - Hardwareadressen → offener Punkt A3
#   - RGB-Beleuchtung, Dachluken, Alarmanlage, Satellit
#     (nicht bestätigte Hardware — Kapitel 18 §34)
#   - Kameras: BESTÄTIGT (2026-08-12), dass keine vorhanden sind. Anders als
#     die Zeile darüber ist das keine offene Frage, sondern eine Antwort —
#     die Domäne `camera` existiert deshalb nicht mehr (Punkt H1).
#
# Die Nivellierung fehlt absichtlich: Hydraulik ist ausdrücklich nicht das
# erste Testobjekt (Kapitel 18 §91).

version: 2
name: Kehler

areas:
  - { id: cab,      name_key: area.cab }
  - { id: living,   name_key: area.living }
  - { id: kitchen,  name_key: area.kitchen }
  - { id: bedroom,  name_key: area.bedroom }
  - { id: bathroom, name_key: area.bathroom }
  - { id: garage,   name_key: area.garage }
  - { id: tech,     name_key: area.tech }
  - { id: exterior, name_key: area.exterior }

entities:

  # ── Wasser ────────────────────────────────────────────────────────────────
  # BESTÄTIGT: zwei Frischwassertanks (550 l und 450 l), Grauwasser 280 l,
  # Schwarzwasser 370 l.
  #
  # BESTÄTIGT: Die Tanks sind gleichmäßig geformt. Die Umrechnung
  # Prozent → Liter ist damit linear und korrekt; es braucht keine
  # Kalibrierkurve.
  #
  # BESTÄTIGT: Zwei Stufen je Tank.
  #   Frischwasser   Warnung unter 20 %,  kritisch unter 10 %
  #   Abwasser       Warnung über  80 %,  kritisch über  90 %
  #
  # Die kritische Stufe bleibt eng gefasst, damit sie selten ist. Zu viele
  # kritische Meldungen entwerten die Priorität (Kapitel 13 §55).

  - id: water.tank.fresh.large
    name_key: tank.fresh_large
    type: measurement
    unit: percent
    capacity_l: 550
    warn_below: 20
    critical_below: 10
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.fresh.small
    name_key: tank.fresh_small
    type: measurement
    unit: percent
    capacity_l: 450
    # Tank bleibt im System sichtbar und wird weiter eingelesen.
    # Wegen des physischen Defekts erzeugt er bis zur Reparatur keine Meldungen.
    alerts_enabled: false
    warn_below: 20
    critical_below: 10
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.grey
    name_key: tank.grey
    type: measurement
    unit: percent
    capacity_l: 280
    warn_above: 80
    critical_above: 90
    deadband: 0.5
    expected_interval_s: 30

  - id: water.tank.black
    name_key: tank.black
    type: measurement
    unit: percent
    capacity_l: 370
    warn_above: 80
    critical_above: 90
    deadband: 0.5
    expected_interval_s: 30

  # ── Ablassventile ─────────────────────────────────────────────────────────
  # BESTÄTIGT (2026-08-12): Grau- und Schwarzwassertank haben **je ein
  # Ablassventil**, insgesamt zwei. Sie kennen ausschließlich **öffnen und
  # schließen** — keine Zwischenstellung, kein Anhalten unterwegs.
  #
  # Sie sind deshalb `valve` und nicht `movable`: Ein bewegliches Teil brächte
  # einen Stopp-Befehl mit, den es an diesen Ventilen nicht gibt, und die
  # Oberfläche zeigte eine Schaltfläche für eine Funktion, die die Hardware
  # nicht hat.
  #
  # `risk: HIGH` bedeutet: Das **Öffnen** verlangt eine bewusste Bestätigung.
  # Das Schließen nicht — der Loader stuft die beiden getrennt ein. Ein offenes
  # Ablassventil entleert den Tank dorthin, wo das Fahrzeug gerade steht; das
  # Schließen beendet genau diesen Zustand und darf nie schwerer erreichbar
  # sein als das Öffnen.
  #
  # Die Bestätigung ist eine Rückfrage und keine Schutzeinrichtung. Wo
  # abgelassen werden darf, entscheidet der Fahrer — Kehler OS kennt keinen
  # Standort und keine Entsorgungsstelle und behauptet daher auch nichts
  # darüber (Kapitel 15 §24).
  #
  # VORLÄUFIG: `timeout_ms`. Wie lange ein Stellantrieb bis zur Rückmeldung
  # braucht, ist nicht genannt; 10 s sind großzügig gewählt und werden mit der
  # Anbindung berichtigt.
  #
  # BESTÄTIGT (2026-08-12): Die Ventile haben **keine Stellungsrückmeldung**.
  # Sie lassen sich ansteuern, aber nicht auslesen.
  #
  # Deshalb `feedback: false`, und das ist kein Vermerk, sondern wirksam:
  #   * Der Command Bus wartet nicht auf eine Bestätigung, die nie kommt.
  #     Sonst endete jeder Befehl nach 10 s mit „keine Rückmeldung" — die
  #     falsche Auskunft, denn fehlgeschlagen ist nichts.
  #   * Der Zustand bleibt dauerhaft „Unbekannt". Das ist kein Mangel der
  #     Software, sondern die Wahrheit über diese Hardware (Kapitel 18 §38).
  #   * Sichtbar bleibt der zuletzt gesendete Befehl, als Befehl gekennzeichnet
  #     und mit Zeitpunkt — nie als Stellung ausgegeben.
  #
  # `timeout_ms` bleibt trotzdem stehen: Es begrenzt, wie lange auf die
  # Annahme durch die SPS gewartet wird, nicht auf eine Stellungsmeldung.

  - id: water.valve.grey
    name_key: valve.grey
    type: valve
    area: tech
    risk: HIGH
    feedback: false
    hold_to_run_open: true
    timeout_ms: 10000

  - id: water.valve.black
    name_key: valve.black
    type: valve
    area: tech
    risk: HIGH
    feedback: false
    timeout_ms: 10000

  # BESTÄTIGT (2026-08-15): Die Frischwasserpumpe arbeitet selbstständig.
  # Sie besitzt keine Bedienfunktion in Kehler OS und deshalb auch keine Entity.

  # BESTÄTIGT (2026-08-15): Die SPS besitzt die Aktion
  # „Sensoren Neustarten“. Das vorhandene Siemens-HMI erzeugt dabei einen
  # kurzen Boolean-Impuls. Derselbe 100-ms-Impuls wurde anschließend direkt
  # über OPC UA am realen Fahrzeug erfolgreich geprüft.
  #
  # Die Aktion hat keinen Zustand und keine Rückmeldung. Während des Neustarts
  # können Messwerte kurzzeitig fehlen bzw. unbekannt werden.
  - id: vehicle.sensors.restart
    name_key: vehicle.sensors_restart
    type: action
    area: tech
    feedback: false
    timeout_ms: 2000
    risk: HIGH

  # BESTÄTIGT (2026-08-31):
  # Der große Frischwassertank besitzt in der Siemens-SPS zwei getrennte
  # HMI-Eingänge zum Starten und Stoppen der Befüllung.
  #
  # Beide Eingänge werden als kurzer Boolean-Impuls betätigt.
  # Eine Rückmeldung, ob die Befüllung tatsächlich läuft, existiert nicht.
  # Kehler OS zeigt deshalb keinen erfundenen Betriebszustand an.
  # BESTÄTIGT (2026-08-31):
  # Relais 23 ist während der Befüllung des großen Frischwassertanks aktiv.
  # TRUE = Befüllung läuft, FALSE = Befüllung nicht aktiv.
  - id: water.fill.large.active
    name_key: water.fill_large_active
    type: contact
    area: tech
    expected_interval_s: 2

  - id: water.fill.large.start
    name_key: water.fill_large_start
    type: action
    area: tech
    feedback: false
    timeout_ms: 2000
    risk: MEDIUM

  - id: water.fill.large.stop
    name_key: water.fill_large_stop
    type: action
    area: tech
    feedback: false
    timeout_ms: 2000
    risk: LOW

  # ── Energie ───────────────────────────────────────────────────────────────
  # BESTÄTIGT: Victron-Anlage, 24-V-Lithiumsystem, Solar auf dem Dach
  # (zehn Module, auf den Fotos sichtbar), Landstromanschluss.
  #
  # VORLÄUFIG: die konkrete Aufteilung der Messwerte. Welche Größen der
  # Cerbo GX tatsächlich liefert, folgt aus der Anbindung (Punkt B1/B2).
  # Die hier gelisteten gibt es in jeder Victron-Anlage.
  #
  # Read-only, mit **zwei** Ausnahmen (Punkt B3, ADR 0003): Eingangsstrom-
  # begrenzung und Wechselrichter ein/aus. Victron bleibt Energiemanagement
  # und Schutzinstanz (Kapitel 12 §33) — Kehler OS regelt nicht mit.
  #
  # Vorzeichenkonvention Batterie: **positiv = laden**, negativ = entladen.

  # BESTÄTIGT: 900 Ah. Zusammen mit der Nennspannung ergibt das den
  # Energieinhalt (900 Ah × 24 V = 21,6 kWh) und daraus die Restlaufzeit.
  - id: energy.battery.soc
    name_key: energy.battery_soc
    type: measurement
    unit: percent
    capacity_ah: 900
    nominal_voltage: 24
    deadband: 0.5
    expected_interval_s: 10

  - id: energy.battery.voltage
    name_key: energy.battery_voltage
    type: measurement
    unit: V
    deadband: 0.1
    expected_interval_s: 10

  - id: energy.battery.current
    name_key: energy.battery_current
    type: measurement
    unit: A
    deadband: 0.5
    expected_interval_s: 10

  - id: energy.battery.power
    name_key: energy.battery_power
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  - id: energy.solar.power
    name_key: energy.solar_power
    type: measurement
    unit: W
    deadband: 5
    expected_interval_s: 10

  - id: energy.consumption.power
    name_key: energy.consumption
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  - id: energy.shore.connected
    name_key: energy.shore_connected
    type: contact
    area: tech
    expected_interval_s: 15

  - id: energy.shore.power
    name_key: energy.shore_power
    type: measurement
    unit: W
    deadband: 10
    expected_interval_s: 10

  # Eingangsstrombegrenzung — einer der beiden erlaubten Schreibzugriffe.
  #
  # BESTÄTIGT: Der Landstromanschluss ist mit 16 A abgesichert. `max_value`
  # bildet genau das ab — der Command Bus weist jeden höheren Wert ab, auch
  # wenn ein Client die Oberfläche umgeht (Kapitel 15 §42).
  #
  # Risiko MEDIUM und nicht HIGH: Innerhalb von 3–16 A kann kein Wert die
  # Zuleitung überlasten, weil die Obergrenze die Absicherung ist. Eine
  # Bestätigung bei jedem Schritt wäre Reibung ohne Schutzwirkung
  # (Kapitel 15 §21).
  - id: energy.shore.limit
    name_key: energy.shore_limit
    type: setpoint
    area: tech
    unit: A
    min_value: 3
    max_value: 16
    step: 1
    risk: MEDIUM
    timeout_ms: 5000

  # Wechselrichter — der zweite erlaubte Schreibzugriff. HIGH bedeutet:
  # bestätigungspflichtig. Ein versehentliches Abschalten nimmt dem ganzen
  # Fahrzeug die 230-V-Versorgung.
  # BESTÄTIGT 2026-08-31 am realen MultiPlus:
  # /Mode besitzt vier schreibbare Zustände:
  # 1 = Nur Ladegerät, 2 = Nur Wechselrichter, 3 = Ein, 4 = Aus.
  - id: energy.inverter.state
    name_key: energy.inverter
    type: select
    area: tech
    states: ["ON", "CHARGER_ONLY", "INVERTER_ONLY", "OFF"]
    risk: HIGH
    expected_interval_s: 10
    timeout_ms: 8000


  # ── Erweiterte Victron-Diagnose ──────────────────────────────────────────
  # BESTÄTIGT 2026-08-31 direkt über MQTT am realen Cerbo GX.

  - id: energy.battery.temperature
    name_key: energy.battery_temperature
    type: measurement
    area: tech
    unit: celsius
    deadband: 0.2
    expected_interval_s: 15

  - id: energy.battery.consumed_ah
    name_key: energy.battery_consumed_ah
    type: measurement
    area: tech
    unit: Ah
    deadband: 0.1
    expected_interval_s: 15

  - id: energy.battery.error_code
    name_key: energy.battery_error_code
    type: measurement
    area: tech
    expected_interval_s: 15

  - id: energy.inverter.operation
    name_key: energy.inverter_operation
    type: status
    area: tech
    states:
      - "OFF"
      - "LOW_POWER"
      - "FAULT"
      - "BULK"
      - "ABSORPTION"
      - "FLOAT"
      - "STORAGE"
      - "EQUALIZE"
      - "PASSTHRU"
      - "INVERTING"
      - "ASSISTING"
      - "POWER_SUPPLY"
      - "TEST"
      - "HUB1"
      - "UNAVAILABLE"
    expected_interval_s: 15

  # Beide real vorhandenen SmartSolar MPPT VE.Can 250/100 rev2.
  - id: energy.solar.mppt1.yield_today
    name_key: energy.solar_mppt1_yield_today
    type: measurement
    area: tech
    unit: kWh
    deadband: 0.01
    expected_interval_s: 15

  - id: energy.solar.mppt1.pv_voltage
    name_key: energy.solar_mppt1_pv_voltage
    type: measurement
    area: tech
    unit: V
    deadband: 0.5
    expected_interval_s: 15

  - id: energy.solar.mppt1.power
    name_key: energy.solar_mppt1_power
    type: measurement
    area: tech
    unit: W
    deadband: 5
    expected_interval_s: 15

  - id: energy.solar.mppt2.yield_today
    name_key: energy.solar_mppt2_yield_today
    type: measurement
    area: tech
    unit: kWh
    deadband: 0.01
    expected_interval_s: 15

  - id: energy.solar.mppt2.pv_voltage
    name_key: energy.solar_mppt2_pv_voltage
    type: measurement
    area: tech
    unit: V
    deadband: 0.5
    expected_interval_s: 15

  - id: energy.solar.mppt2.power
    name_key: energy.solar_mppt2_power
    type: measurement
    area: tech
    unit: W
    deadband: 5
    expected_interval_s: 15

  # VE.Bus-Alarme. 0 = OK; Warnung/Alarm werden getrennt übernommen.
  - id: energy.inverter.alarm.overload
    name_key: energy.inverter_alarm_overload
    type: status
    area: tech
    states: ["OK", "WARNING", "ALARM"]
    expected_interval_s: 15

  - id: energy.inverter.alarm.high_temperature
    name_key: energy.inverter_alarm_high_temperature
    type: status
    area: tech
    states: ["OK", "WARNING", "ALARM"]
    expected_interval_s: 15

  - id: energy.inverter.alarm.low_battery
    name_key: energy.inverter_alarm_low_battery
    type: status
    area: tech
    states: ["OK", "WARNING", "ALARM"]
    expected_interval_s: 15

  - id: energy.inverter.alarm.ripple
    name_key: energy.inverter_alarm_ripple
    type: status
    area: tech
    states: ["OK", "WARNING", "ALARM"]
    expected_interval_s: 15

  - id: energy.inverter.alarm.bms_connection
    name_key: energy.inverter_alarm_bms_connection
    type: status
    area: tech
    states: ["OK", "WARNING", "ALARM"]
    expected_interval_s: 15

  # Lynx-Smart-BMS-Alarme.
  - id: energy.battery.alarm.bms_cable
