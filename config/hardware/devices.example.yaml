# Kehler OS – Geräte (Schemabeispiel)
#
# Physische Geräte und ihre Verbindung. Enthält bewusst keine echten Adressen
# oder Zugangsdaten (Kapitel 18 §97). Secrets stehen NIE hier, sondern in der
# Umgebungskonfiguration bzw. im Secret-Store (Kapitel 15 §49/§50).

version: 1

devices:

  - id: plc
    name: Siemens S7-1511-1 PN
    kind: PLC
    vendor: Siemens
    model: S7-1511-1 PN
    # Transport: s7 | simulated              (entschieden in ADR 0002)
    # Bleibt simuliert, bis A2 und A3 vorliegen.
    transport: simulated
    connection:
      host: null              # <TODO: IP der CPU, Punkt A2>
      rack: 0
      slot: 1
      port: 102               # ISO-on-TCP
    # Voraussetzung in TIA Portal (siehe ADR 0002):
    #   - PUT/GET-Kommunikation erlauben
    #   - optimierter Bausteinzugriff bei den genutzten DBs deaktiviert
    poll_interval_ms: 500
    reconnect:
      initial_delay_ms: 1000
      max_delay_ms: 60000
      backoff_factor: 2

  - id: victron
    name: Victron Cerbo GX
    kind: ENERGY
    vendor: Victron Energy
    model: Cerbo GX
    # Transport: mqtt | modbus | simulated   (siehe ADR 0003)
    transport: simulated
    connection:
      host: null              # <TODO: IP des Cerbo GX>
      mqtt_port: 1883
      portal_id: null         # <TODO: VRM-Portal-ID, Teil aller Topics>
      tls: false
      credentials_ref: null
    # Der Cerbo stoppt die Publikation ohne regelmäßigen Keepalive
    keepalive_interval_s: 30
    # Schreiben ist auf genau zwei Funktionen begrenzt (Punkt B3, ADR 0003).
    # Es gibt keine generische Schreibfunktion – was hier nicht steht,
    # kann der Adapter nicht setzen.
    writable:
      - id: energy.shore_power.current_limit
        path: null            # <TODO: in Phase 10 am realen Gerät verifizieren>
        unit: A
        min: 0
        max: null             # <TODO: reale Absicherung des Landstroms, Punkt B2>
        requires_permission: energy.control
        confirm: false
      - id: energy.inverter.mode
        path: null            # <TODO: in Phase 10 am realen Gerät verifizieren>
        values: [ON, OFF]
        requires_permission: energy.control
        # Abschalten kappt die 230-V-Versorgung im Fahrzeug
        confirm: true
        risk: HIGH

# Kameras werden erst eingetragen, wenn tatsächlich welche installiert sind.
# Kapitel 12 §51 und Kapitel 18 §33: keine Kamera wird angenommen.
